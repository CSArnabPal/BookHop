name: Deploy BookHop

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookhop-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Check backend dependencies
        run: |
          cd backend
          npm ci --omit=dev

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/bookhop_actions
          chmod 600 ~/.ssh/bookhop_actions

          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts


          ssh \
            -i ~/.ssh/bookhop_actions \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd ~/BookHop && git pull --ff-only origin main && sudo docker compose up --build -d && sudo docker compose ps'

      - name: Verify HTTPS
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 20 \
            https://bookhop.webredirect.org/

